# Creates one FREE service; no account or deployment is created by this file.
# PUBLIC_BASE_URL must be set to the actual HTTPS origin assigned by Render.
services:
  - type: web
    name: safetyhack-webrtc
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Optional FCM: upload SERVER key via Render Secret Files, then manually set
      # GOOGLE_APPLICATION_CREDENTIALS=/etc/secrets/firebase-service-account.json
      # See FIREBASE.md. Do not upload Android google-services.json here.
      - key: PUBLIC_BASE_URL
        value: https://safetyhack-webrtc.onrender.com
      - key: ANALYSIS_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-live
      - key: RTC_ICE_SERVERS_JSON
        value: '[{"urls":"stun:stun.l.google.com:19302"}]'
